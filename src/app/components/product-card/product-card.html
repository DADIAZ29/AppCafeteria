<div class="card shadow-sm h-100 p-3">
  <div class="card-body d-flex flex-column">
    <span class="badge bg-secondary align-self-start mb-2">{{ producto.categoria }}</span>
    <h5 class="card-title">{{ producto.nombre }}</h5>
    <p class="card-text text-success fw-bold fs-5">${{ producto.precio | number:'1.2-2' }}</p>
    <button class="btn btn-primary mt-auto" (click)="comprar()">Ver / Seleccionar</button>
  </div>
</div>
